<svg xmlns="http://www.w3.org/2000/svg" class="bunga" viewBox="-50 -20 345 550" width="345" height="550" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.bunga { overflow: visible; }
.bunga .sway, .bunga .bloom, .bunga .leaf-sway { transform-box: fill-box; }
.bunga .bloom { transform-origin: 50% 100%; animation: mekar 1.6s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d, 0s); }
.bunga .sway { transform-origin: 50% 100%; animation: goyang 5.5s ease-in-out infinite alternate; animation-delay: var(--d, 0s); }
.bunga .leaf-sway { transform-origin: 0% 50%; animation: daun 4.2s ease-in-out infinite alternate; animation-delay: var(--d, 0s); }
.bunga .stem { stroke-dasharray: 1; stroke-dashoffset: 1; animation: tumbuh 2.2s ease-out forwards; }
.bunga .leaves { animation: muncul 1s ease-out .4s both; }
@keyframes tumbuh { to { stroke-dashoffset: 0; } }
@keyframes muncul { from { opacity: 0; } to { opacity: 1; } }
@keyframes mekar { from { transform: scale(0) rotate(-25deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes goyang { from { transform: rotate(-2.8deg) scale(1); } to { transform: rotate(2.8deg) scale(1.03); } }
@keyframes daun { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }
@media (prefers-reduced-motion: reduce) {
  .bunga *, .bunga { animation: none !important; }
  .bunga .stem { stroke-dashoffset: 0; }
}
</style>

